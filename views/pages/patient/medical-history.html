<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ khám — TechCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/patient/layout.css" />
  <link rel="stylesheet" href="/css/patient/component.css" />
  <link rel="stylesheet" href="/css/patient/pages.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="app-body" data-page="history">
  <div id="navMount"></div>
  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="menu-btn" id="sidebarToggle"><i data-lucide="menu"></i></button>
        <h1 id="pageTitle">Hồ sơ khám bệnh</h1>
      </div>
    </header>
    <main class="page-content">
      <section class="history-hero">
        <div>
          <h2>Hồ sơ khám bệnh điện tử</h2>
          <p>Theo dõi tiến trình khám, thanh toán và chẩn đoán nhanh chóng.</p>
        </div>
        <div class="history-search-wrap">
          <i data-lucide="search"></i>
          <input type="search" id="historySearch" class="form-input" placeholder="Tìm theo bác sĩ, khoa, chẩn đoán..." />
        </div>
      </section>
      <section class="history-stats" id="historyStats">
        <div class="skeleton" style="height:66px"></div>
      </section>
      <div class="filter-bar">
        <select id="filterPayment" class="form-select">
          <option value="">Tất cả thanh toán</option>
          <option value="unpaid">Chưa thanh toán</option>
          <option value="paid">Đã thanh toán</option>
        </select>
        <select id="filterStatus" class="form-select">
          <option value="">Tất cả trạng thái</option>
          <option value="open">Đang mở</option>
          <option value="completed">Hoàn thành</option>
        </select>
      </div>
      <div class="card">
        <div class="card-body" style="padding-top:0">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Ngày khám</th>
                  <th>Bác sĩ / Khoa</th>
                  <th>Chẩn đoán</th>
                  <th>Tổng phí</th>
                  <th>Thanh toán</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="historyBody">
                <tr><td colspan="6"><div class="skeleton" style="height:48px"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/patient/common.js"></script>
  <script src="/js/patient/navigation.js"></script>
  <script src="/js/patient/medical-history.js"></script>
</body>
</html>
