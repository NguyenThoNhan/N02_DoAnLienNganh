<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Thanh toán TechCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(160deg, #0f766e 0%, #1d4ed8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #0f172a;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .logo { font-family: 'Sora', sans-serif; font-weight: 700; color: #2563eb; margin-bottom: 8px; }
    h1 { font-size: 1.15rem; margin-bottom: 6px; }
    .amount { font-family: 'Sora', sans-serif; font-size: 1.75rem; font-weight: 700; color: #0d9488; margin: 16px 0; }
    .desc { font-size: 0.85rem; color: #64748b; word-break: break-all; margin-bottom: 20px; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: linear-gradient(135deg, #0d9488, #2563eb); color: #fff; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 16px; font-size: 0.9rem; }
    .ok { color: #16a34a; font-weight: 600; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <p class="logo">TechCare</p>
    <p>Đang tải...</p>
  </div>
  <script src="/js/patient/pay-mobile.js"></script>
</body>
</html>
