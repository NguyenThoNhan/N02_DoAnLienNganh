<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bệnh nhân — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin/layout.css" />
  <link rel="stylesheet" href="/css/admin/component.css" />
  <link rel="stylesheet" href="/css/admin/pages.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="app-body" data-page="patients">
  <div id="navMount"></div>
  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="menu-btn" id="sidebarToggle"><i data-lucide="menu"></i></button>
        <h1 id="pageTitle">Quản lý bệnh nhân</h1>
      </div>
      <div class="topbar-actions"><p class="topbar-greeting"><strong id="topUserName">—</strong></p></div>
    </header>
    <main class="page-content">
      <div class="toolbar">
        <div class="toolbar-left">
          <input type="search" id="searchInput" class="form-input" placeholder="Tìm tên, SĐT..." style="max-width:240px" />
          <select id="filterStatus" class="form-input" style="width:auto">
            <option value="">Tất cả trạng thái</option>
            <option value="active">Hoạt động</option>
            <option value="inactive">Ngưng</option>
            <option value="banned">Khóa</option>
          </select>
        </div>
      </div>
      <div class="card">
        <div class="card-body" style="padding-top:0">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>Họ tên</th><th>SĐT</th><th>Email</th><th>Ngày tạo</th><th>Trạng thái</th><th></th></tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="toolbar" style="margin-top:16px;margin-bottom:0">
            <span id="pageInfo" class="text-muted"></span>
            <div class="toolbar-right">
              <button type="button" class="btn btn-outline btn-sm" id="btnPrev">Trước</button>
              <button type="button" class="btn btn-outline btn-sm" id="btnNext">Sau</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/admin/common.js"></script>
  <script src="/js/admin/navigation.js"></script>
  <script src="/js/admin/manage-patients.js"></script>
</body>
</html>
